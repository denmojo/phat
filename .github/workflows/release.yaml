name: release
# On a version tag, builds the Linux and Windows downloads and attaches them
# to a draft release. The macOS downloads are signed and notarized on the
# maintainer's Mac and uploaded to the same draft before it's published.
on:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor at 2.35, so the Linux builds
          # run on Debian 12 and 64-bit Raspberry Pi OS.
          - target: linux_amd64
            os: ubuntu-22.04
          - target: linux_arm64
            os: ubuntu-22.04-arm
          - target: windows_amd64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: Build (Linux, with libax25 for kernel AX.25)
        if: ${{ startsWith(matrix.target, 'linux') }}
        run: |
          ./make.bash libax25
          ./make.bash
      - name: Build (Windows)
        if: ${{ matrix.target == 'windows_amd64' }}
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o phat.exe
      - name: Package
        run: |
          name="phat_${GITHUB_REF_NAME#v}_${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md "$name"/
          if [ -f phat.exe ]; then
            cp phat.exe "$name"/
            zip -r "$name.zip" "$name"
          else
            cp phat "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            phat_*.tar.gz
            phat_*.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
