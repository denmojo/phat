<!doctype html>
<html lang="en" data-appname="{{.AppName}}" data-version="{{.Version}}" data-mycall="{{.Mycall}}" data-appearance="{{.Appearance}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.AppName}} - Settings</title>
  <link rel="icon" type="image/png" href="/dist/static/pat_logo.png" />
  <script>
    (function () {
      var a = document.documentElement.getAttribute('data-appearance') || 'system';
      if (a === 'system') a = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', a);
    })();
  </script>
  <script type="module" crossorigin src="/dist/js/settings-CiTElbbE.js"></script>
  <link rel="modulepreload" crossorigin href="/dist/js/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="/dist/js/jsxRuntime.module-2Uc63QWo.js">
</head>
<body><div id="app"></div></body>
</html>
